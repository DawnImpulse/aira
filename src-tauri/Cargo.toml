[package]
name = "ide"
version = "0.0.0"
description = "Multi-project IDE"
authors = ["Saksham"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: child webviews (Window::add_child) for the embedded Browser tab. `devtools`: runtime
# open_devtools() in release builds.
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
sysinfo = "0.39.6"
notify-debouncer-full = "0.7.0"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1.53.1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json"] }
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22"
mac-notification-sys = "0.6"
# WKWebView snapshots for the Browser tab's captures (same versions wry already pulls in).
objc2 = "0.6"
objc2-web-kit = "0.3"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
png = "0.18"
